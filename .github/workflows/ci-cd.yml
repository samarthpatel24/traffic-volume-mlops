name: Simple CI/CD with ECR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Simple tests
      run: |
        # Basic import tests
        python -c "import pandas, numpy, sklearn, flask; print('✅ All imports successful')"
        
        # Test Flask app can be imported
        python -c "
        import os
        os.environ['USE_S3'] = 'false'
        exec(open('flask_app.py').read().split('if __name__')[0])
        print('✅ Flask app imports successful')
        "
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push to both ECR and Docker Hub
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: traffic-volume-predictor
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image
        docker build -f Dockerfile.aws -t traffic-predictor:$IMAGE_TAG .
        
        # Tag for ECR
        docker tag traffic-predictor:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag traffic-predictor:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # Tag for Docker Hub
        docker tag traffic-predictor:$IMAGE_TAG $DOCKER_HUB_USERNAME/traffic-volume-predictor:$IMAGE_TAG
        docker tag traffic-predictor:$IMAGE_TAG $DOCKER_HUB_USERNAME/traffic-volume-predictor:latest
        
        # Push to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # Push to Docker Hub
        docker push $DOCKER_HUB_USERNAME/traffic-volume-predictor:$IMAGE_TAG
        docker push $DOCKER_HUB_USERNAME/traffic-volume-predictor:latest
        
        echo "✅ Images pushed to both ECR and Docker Hub"
        echo "ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "Docker Hub: $DOCKER_HUB_USERNAME/traffic-volume-predictor:$IMAGE_TAG"