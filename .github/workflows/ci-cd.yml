name: Simple CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest boto3
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # Check for Python syntax errors
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.git,__pycache__,.venv
    
    - name: Test Flask app imports
      run: |
        echo "Testing Flask app..."
        python -c "
        import sys
        sys.path.append('src')
        
        # Test model selector
        from model_selector import ModelSelector
        print('✅ Model selector import successful')
        
        # Test Flask app imports (without S3)
        import os
        os.environ['USE_S3'] = 'false'
        exec(open('flask_app_s3.py').read().split('if __name__')[0])
        print('✅ Flask app imports successful')
        "
    
    - name: Test S3 utilities (without connection)
      run: |
        echo "Testing S3 utilities..."
        python -c "
        import sys
        sys.path.append('src')
        try:
            from s3_utils import S3ModelManager
            print('✅ S3 utilities import successful')
        except ImportError as e:
            print(f'⚠️ S3 utilities import failed (expected without boto3): {e}')
        "
    
    - name: Validate configuration
      run: |
        echo "Validating configuration..."
        python -c "
        import yaml
        with open('config/config.yaml', 'r') as f:
            config = yaml.safe_load(f)
        
        required_keys = ['data', 'model', 'training', 'evaluation']
        for key in required_keys:
            assert key in config, f'Missing config key: {key}'
        
        print('✅ Configuration validation passed')
        "
    
    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -f Dockerfile.aws -t traffic-predictor:latest .
        echo "✅ Docker build successful"
    
    - name: Test Docker container
      run: |
        echo "Testing Docker container..."
        # Run container in test mode (without S3)
        docker run --rm -d \
          --name test-container \
          -p 8501:8501 \
          -e USE_S3=false \
          traffic-predictor:latest
        
        # Wait for container to start
        sleep 10
        
        # Test health endpoint
        if curl -f http://localhost:8501/health; then
          echo "✅ Container health check passed"
        else
          echo "❌ Container health check failed"
          docker logs test-container
          exit 1
        fi
        
        # Stop container
        docker stop test-container

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.aws
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/traffic-volume-predictor:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/traffic-volume-predictor:${{ github.sha }}
    
    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      if: env.EC2_HOST != ''
      run: |
        echo "Deploying to EC2..."
        
        # Create SSH key file
        echo "$EC2_SSH_KEY" > ec2-key.pem
        chmod 400 ec2-key.pem
        
        # Deploy to EC2
        ssh -i ec2-key.pem -o StrictHostKeyChecking=no \
          $EC2_USER@$EC2_HOST << EOF
          
          # Pull latest image
          docker pull $DOCKER_HUB_USERNAME/traffic-volume-predictor:latest
          
          # Stop and remove old container
          docker stop traffic-app || true
          docker rm traffic-app || true
          
          # Run new container
          docker run -d \
            --name traffic-app \
            --restart unless-stopped \
            -p 80:8501 \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION \
            -e S3_BUCKET_NAME=$S3_BUCKET_NAME \
            -e USE_S3=true \
            $DOCKER_HUB_USERNAME/traffic-volume-predictor:latest
          
          # Wait for container to start
          sleep 10
          
          # Test deployment
          if curl -f http://localhost/health; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            docker logs traffic-app
            exit 1
          fi
        EOF
        
        # Cleanup
        rm ec2-key.pem
        
        echo "🚀 Deployment completed successfully!"